services:
  php:
    build: ./docker/php
    container_name: php84-abelohost
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql

  nginx:
    image: openresty/openresty:alpine
    container_name: nginx-abelohost
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  mysql:
      image: mysql:8.0.46
      container_name: mysql-abelohost
      ports:
        - 3308:3306
      environment:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: app
        MYSQL_USER: app
        MYSQL_PASSWORD: app
      volumes:
        - ./data:/var/lib/mysql
        - ./docker/mysql/init-test-database.sql:/docker-entrypoint-initdb.d/10-init-test-database.sql:ro

volumes:
  mariadb_data:
